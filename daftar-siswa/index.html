var ROMBELS = ["X-M-1", "X-M-2", "X-M-3", "X-M-4", "X-M-5", "X-M-6", "X-M-7", "X-M-8", "XI-M-1", "XI-M-2", "XI-M-3", "XI-M-4", "XI-M-5", "XI-M-6", "XI-M-7", "XI-M-8", "XII-M-1", "XII-M-2", "XII-M-3", "XII-M-4", "XII-M-5", "XII-M-6", "XII-M-7", "XII-M-8", "XII-M-9"];
var gradeAktif = "";
var rombelAktif = "";

var dd = document.getElementById("dd");
var ddBtn = document.getElementById("ddBtn");
var ddList = document.getElementById("ddList");
var ddLabel = document.getElementById("ddLabel");
var selAsli = document.getElementById("rombelAsli");
selAsli.innerHTML = '<option value="">Semua rombel</option>' + ROMBELS.map(function(r) { return '<option value="' + r + '">' + r + '</option>'; }).join("");

function gradeOf(rombel) { return rombel.split("-M-")[0]; }

function bangunDaftar() {
  var isi = '<div class="dd-opt' + (rombelAktif === "" ? " pilih" : "") + '" data-v="">Semua rombel</div>';
  var gradeTerakhir = "";
  ROMBELS.forEach(function(r) {
    var g = gradeOf(r);
    if (g !== gradeTerakhir) { isi += '<div class="dd-opt grup">Kelas ' + g + '</div>'; gradeTerakhir = g; }
    isi += '<div class="dd-opt' + (rombelAktif === r ? " pilih" : "") + '" data-v="' + r + '">' + r + '</div>';
  });
  ddList.innerHTML = isi;
}
bangunDaftar();

function tutupDd() { dd.classList.remove("buka"); ddBtn.setAttribute("aria-expanded", "false"); }
ddBtn.addEventListener("click", function(e) {
  e.stopPropagation();
  var buka = dd.classList.toggle("buka");
  ddBtn.setAttribute("aria-expanded", buka ? "true" : "false");
});
document.addEventListener("click", function(e) {
  if (!dd.contains(e.target)) tutupDd();
});
document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") tutupDd();
});
ddList.addEventListener("click", function(e) {
  var opt = e.target.closest(".dd-opt[data-v]");
  if (!opt) return;
  rombelAktif = opt.getAttribute("data-v");
  selAsli.value = rombelAktif;
  ddLabel.textContent = rombelAktif === "" ? "Semua rombel" : "Rombel " + rombelAktif;
  if (rombelAktif) {
    gradeAktif = gradeOf(rombelAktif);
    document.querySelectorAll(".tab").forEach(function(b) {
      b.classList.toggle("aktif", b.getAttribute("data-grade") === gradeAktif);
    });
  }
  bangunDaftar();
  tutupDd();
  tampil();
});

function tampil() {
  var q = document.getElementById("cari").value.trim().toLowerCase();
  var hasil = DATA.filter(function(s) {
    if (gradeAktif && gradeOf(s.rombel) !== gradeAktif) return false;
    if (rombelAktif && s.rombel !== rombelAktif) return false;
    if (q) {
      var gab = (s.nama + " " + s.nisn + " " + s.nipd).toLowerCase();
      if (gab.indexOf(q) === -1) return false;
    }
    return true;
  });
  document.getElementById("hitung").innerHTML = "Menampilkan <b>" + hasil.length + "</b> dari " + DATA.length + " siswa";
  var wadah = document.getElementById("hasil");
  if (!hasil.length) {
    wadah.innerHTML = '<div class="kosong">Tidak ada siswa yang cocok dengan pencarian.</div>';
    return;
  }
  var t = '<table><thead><tr><th>No</th><th>Nama</th><th>NIPD</th><th>NISN</th><th>Rombel</th></tr></thead><tbody>';
  hasil.forEach(function(s, i) {
    t += '<tr><td>' + (i + 1) + '</td><td class="nama">' + s.nama + '</td><td>' + s.nipd + '</td><td>' + s.nisn + '</td><td><span class="rombel">' + s.rombel + '</span></td></tr>';
  });
  t += '</tbody></table>';
  wadah.innerHTML = t;
}

document.getElementById("cari").addEventListener("input", tampil);
document.getElementById("tabs").addEventListener("click", function(e) {
  if (e.target.classList.contains("tab")) {
    document.querySelectorAll(".tab").forEach(function(b) { b.classList.remove("aktif"); });
    e.target.classList.add("aktif");
    gradeAktif = e.target.getAttribute("data-grade");
    rombelAktif = "";
    selAsli.value = "";
    ddLabel.textContent = "Semua rombel";
    bangunDaftar();
    tampil();
  }
});
tampil();
</script>
